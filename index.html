<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 包剪揼</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1d2433; --muted:#6b7285; --accent:#4f6df5; --win:#1f9d55; --lose:#d64545; --draw:#c58b00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141824; --card:#1e2436; --text:#eef1f8; --muted:#9aa3b8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,"PingFang HK","Microsoft JhengHei",sans-serif; }
  main { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  h1 { margin:0; text-align:center; font-size:1.6rem; }
  .card { background:var(--card); border-radius:16px; padding:14px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .score { display:flex; justify-content:space-around; text-align:center; }
  .score b { display:block; font-size:2rem; }
  .score span { color:var(--muted); font-size:.9rem; }
  .stage { position:relative; aspect-ratio:1/1; background:#000; border-radius:12px; overflow:hidden; }
  .stage canvas { width:100%; height:100%; display:block; transform:scaleX(-1); }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:7rem; font-weight:800; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.7); pointer-events:none; }
  .versus { display:flex; align-items:center; justify-content:space-around; font-size:4rem; text-align:center; min-height:6rem; }
  .versus small { display:block; font-size:.9rem; color:var(--muted); }
  .result { text-align:center; font-size:1.6rem; font-weight:800; min-height:2.2rem; }
  .result.win{color:var(--win)} .result.lose{color:var(--lose)} .result.draw{color:var(--draw)}
  .bars div { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .bars .name { width:2.5rem; }
  .bars .track { flex:1; height:14px; background:rgba(128,128,128,.2); border-radius:7px; overflow:hidden; }
  .bars .fill { height:100%; width:0; background:var(--accent); transition:width .15s; }
  .bars .pct { width:3.2rem; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  button { font:inherit; font-weight:700; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#fff; width:100%; cursor:pointer; }
  button:disabled { opacity:.5; }
  select { font:inherit; padding:6px; border-radius:8px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .hint { color:var(--muted); font-size:.9rem; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>✊✋✌️ AI 包剪揼</h1>

  <div class="card score">
    <div><b id="sWin">0</b><span>你贏</span></div>
    <div><b id="sDraw">0</b><span>平手</span></div>
    <div><b id="sLose">0</b><span>AI 贏</span></div>
  </div>

  <div class="card">
    <div class="stage">
      <canvas id="cam" width="400" height="400"></canvas>
      <div class="overlay" id="overlay"></div>
    </div>
    <p class="hint" id="status">按「開始」載入 AI 並開啟鏡頭</p>
  </div>

  <div class="card versus" id="versus" hidden>
    <div><span id="youEmoji"></span><small>你</small></div>
    <div style="font-size:1.6rem">VS</div>
    <div><span id="aiEmoji"></span><small>AI</small></div>
  </div>
  <div class="result" id="result"></div>

  <div class="card bars" id="bars">
    <div class="row"><b>AI 的判斷(信心度)</b></div>
  </div>

  <div class="card row">
    <label>AI 出拳策略
      <select id="mode">
        <option value="random">隨機</option>
        <option value="cheat">後出(作弊)</option>
        <option value="learn">學習你的習慣</option>
      </select>
    </label>
  </div>

  <button id="btn">開始</button>
  <p class="hint">提示:手放在畫面中央、光線充足、背景簡單,辨識更準。</p>
</main>

<script src="lib/tf.min.js"></script>
<script src="lib/teachablemachine-image.min.js"></script>
<script>
// 類別順序必須和 Teachable Machine 訓練時一致(labels.txt: 0 包, 1 剪, 2 揼)
const MOVES = [
  { name: '包', emoji: '✋' },
  { name: '剪', emoji: '✌️' },
  { name: '揼', emoji: '✊' },
];
const MODEL_URL = 'model/model.json';
const META_URL  = 'model/metadata.json';
const CONF_MIN  = 0.6; // 低於此信心度視為「看不清」

const $ = id => document.getElementById(id);
let model, webcam, ready = false, busy = false, latest = [0,0,0];
const score = { win:0, draw:0, lose:0 };
const history = [0,0,0]; // 學生出過各手勢的次數

// 建立信心度條
MOVES.forEach((m,i) => {
  const d = document.createElement('div');
  d.innerHTML = `<span class="name">${m.emoji}${m.name}</span><span class="track"><span class="fill" id="f${i}" style="display:block"></span></span><span class="pct" id="p${i}">0%</span>`;
  $('bars').appendChild(d);
});

async function init() {
  $('btn').disabled = true;
  $('status').textContent = '載入 AI 模型中…';
  try {
    model = await tmImage.load(MODEL_URL, META_URL);
    webcam = new tmImage.Webcam(400, 400, false); // 不在庫內翻轉,由 CSS 鏡像顯示
    await webcam.setup({ facingMode: 'user' });
    await webcam.play();
  } catch (e) {
    $('status').textContent = '啟動失敗:' + e.message + '(請允許鏡頭權限,並確認是 https 網址)';
    $('btn').disabled = false;
    return;
  }
  ready = true;
  $('btn').disabled = false;
  $('btn').textContent = '出拳!';
  $('status').textContent = '準備好了,按「出拳!」';
  loop();
}

async function predict() {
  const p = await model.predict(webcam.canvas);
  // 依 className 對應,避免順序假設出錯
  const out = [0,0,0];
  p.forEach(x => {
    const i = MOVES.findIndex(m => x.className.includes(m.name));
    out[i >= 0 ? i : p.indexOf(x)] = x.probability;
  });
  return out;
}

function draw(probs) {
  probs.forEach((v,i) => {
    $('f'+i).style.width = (v*100).toFixed(0) + '%';
    $('p'+i).textContent = (v*100).toFixed(0) + '%';
  });
}

let ticking = false;
async function loop() {
  webcam.update();
  $('cam').getContext('2d').drawImage(webcam.canvas, 0, 0);
  if (!ticking) {
    ticking = true;
    predict().then(p => { latest = p; draw(p); ticking = false; });
  }
  requestAnimationFrame(loop);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function aiPick(mode, playerMove) {
  if (mode === 'cheat') return (playerMove + 2) % 3;           // 剛好贏
  if (mode === 'learn') {
    const likely = history.indexOf(Math.max(...history));      // 學生最常出的
    if (history.every(v => v === 0)) return Math.floor(Math.random()*3);
    return (likely + 2) % 3;                                    // 出剋它的
  }
  return Math.floor(Math.random()*3);
}
// 0包 1剪 2揼:剪贏包、揼贏剪、包贏揼 → a 贏 b 當 (a - b + 3) % 3 === 2 ... 用查表最清楚
const BEATS = { 1:0, 2:1, 0:2 }; // key 贏 value
function judge(you, ai) {
  if (you === ai) return 'draw';
  return BEATS[you] === ai ? 'win' : 'lose';
}

async function play() {
  if (!ready || busy) return;
  busy = true; $('btn').disabled = true;
  $('versus').hidden = true; $('result').textContent = ''; $('result').className = 'result';

  for (const t of ['3','2','1','出!']) {
    $('overlay').textContent = t;
    await sleep(t === '出!' ? 300 : 800);
  }
  $('overlay').textContent = '';

  // 在「出!」後取樣約 0.5 秒,取信心度最高的一次
  let best = [0,0,0], bestMax = 0;
  const end = Date.now() + 500;
  while (Date.now() < end) {
    if (Math.max(...latest) > bestMax) { best = latest.slice(); bestMax = Math.max(...latest); }
    await sleep(50);
  }
  const you = best.indexOf(bestMax);
  $('versus').hidden = false;

  if (bestMax < CONF_MIN) {
    $('youEmoji').textContent = '❓'; $('aiEmoji').textContent = '🤖';
    $('result').textContent = 'AI 看不清你的手勢,再試一次';
    $('result').className = 'result draw';
  } else {
    const ai = aiPick($('mode').value, you);
    history[you]++;
    const r = judge(you, ai);
    score[r]++;
    $('youEmoji').textContent = MOVES[you].emoji;
    $('aiEmoji').textContent = MOVES[ai].emoji;
    $('result').textContent = { win:'你贏了 🎉', lose:'AI 贏了 🤖', draw:'平手' }[r]
      + `(AI 認為你出「${MOVES[you].name}」${(bestMax*100).toFixed(0)}%)`;
    $('result').className = 'result ' + r;
    $('sWin').textContent = score.win; $('sDraw').textContent = score.draw; $('sLose').textContent = score.lose;
  }
  busy = false; $('btn').disabled = false;
}

$('btn').addEventListener('click', () => ready ? play() : init());
</script>
</body>
</html>

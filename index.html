<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 包剪揼</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1d2433; --muted:#6b7285; --accent:#4f6df5; --win:#1f9d55; --lose:#d64545; --draw:#c58b00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141824; --card:#1e2436; --text:#eef1f8; --muted:#9aa3b8; }
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; padding:8px 12px; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,"PingFang HK","Microsoft JhengHei",sans-serif; overflow:hidden; }
  /* 整頁固定為一屏高度,鏡頭區自動伸縮,不需要捲動 */
  main { height:100%; max-width:640px; margin:0 auto; display:grid; grid-template-rows:auto minmax(0,1fr) auto auto; gap:8px;
         grid-template-areas:"head" "stage" "bars" "ctrl"; }
  .head { grid-area:head; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  h1 { margin:0; font-size:1.15rem; white-space:nowrap; }
  .score { display:flex; gap:12px; font-size:.85rem; color:var(--muted); }
  .score b { color:var(--text); font-size:1.1rem; margin-left:2px; }
  .stage { grid-area:stage; position:relative; background:#000; border-radius:12px; overflow:hidden; min-height:0; }
  .stage canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transform:scaleX(-1); }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:min(30vw,7rem); font-weight:800; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.7); pointer-events:none; }
  .status { position:absolute; left:0; right:0; top:0; padding:6px 10px; font-size:.85rem; color:#fff; background:linear-gradient(rgba(0,0,0,.6),transparent); text-align:center; }
  .panel { position:absolute; left:8px; right:8px; bottom:8px; padding:8px 10px; border-radius:10px; background:rgba(20,24,36,.82); color:#fff; text-align:center; }
  .versus { display:flex; align-items:center; justify-content:space-around; font-size:clamp(2rem,9vh,3.2rem); line-height:1.1; }
  .versus small { display:block; font-size:.75rem; opacity:.7; }
  .versus .vs { font-size:1rem; opacity:.8; }
  .result { font-size:1.15rem; font-weight:800; }
  .result.win{color:#4ade80} .result.lose{color:#ff7b7b} .result.draw{color:#fbbf24}
  .detail { font-size:.8rem; opacity:.8; }
  .bars { grid-area:bars; background:var(--card); border-radius:12px; padding:6px 10px; }
  .bars div { display:flex; align-items:center; gap:8px; margin:2px 0; }
  .bars .name { width:3rem; font-size:.9rem; }
  .bars .track { flex:1; height:10px; background:rgba(128,128,128,.2); border-radius:5px; overflow:hidden; }
  .bars .fill { height:100%; width:0; background:var(--accent); transition:width .15s; }
  .bars .pct { width:2.8rem; text-align:right; color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums; }
  .ctrl { grid-area:ctrl; display:flex; gap:8px; align-items:stretch; padding-bottom:env(safe-area-inset-bottom,0px); }
  button { font:inherit; font-weight:700; padding:12px; border:0; border-radius:12px; background:var(--accent); color:#fff; flex:1; cursor:pointer; }
  button:disabled { opacity:.5; }
  select { font:inherit; padding:0 8px; border-radius:12px; border:1px solid rgba(128,128,128,.4); background:var(--card); color:var(--text); max-width:42%; }
  [hidden] { display:none !important; }
  /* 橫屏手機 / 寬螢幕:鏡頭在左,資訊在右 */
  @media (orientation:landscape) and (max-height:520px), (min-width:900px) and (orientation:landscape) {
    main { max-width:1000px; grid-template-columns:minmax(0,1fr) 300px; grid-template-rows:auto auto minmax(0,1fr);
           grid-template-areas:"stage head" "stage bars" "stage ctrl"; align-content:start; }
    .ctrl { flex-direction:column; }
    select { max-width:none; padding:10px; }
    .head { flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>
<main>
  <div class="head">
    <h1>✊✋✌️ AI 包剪揼</h1>
    <div class="score">
      <span>你贏<b id="sWin">0</b></span>
      <span>平手<b id="sDraw">0</b></span>
      <span>AI贏<b id="sLose">0</b></span>
    </div>
  </div>

  <div class="stage">
    <canvas id="cam" width="400" height="400"></canvas>
    <div class="status" id="status">按「開始」載入 AI 並開啟鏡頭</div>
    <div class="overlay" id="overlay"></div>
    <div class="panel" id="panel" hidden>
      <div class="versus" id="versus">
        <div><span id="youEmoji"></span><small>你</small></div>
        <div class="vs">VS</div>
        <div><span id="aiEmoji"></span><small>AI</small></div>
      </div>
      <div class="result" id="result"></div>
      <div class="detail" id="detail"></div>
    </div>
  </div>

  <div class="bars" id="bars"></div>

  <div class="ctrl">
    <select id="mode" aria-label="AI 出拳策略">
      <option value="random">AI:隨機</option>
      <option value="cheat">AI:後出(作弊)</option>
      <option value="learn">AI:學習習慣</option>
    </select>
    <button id="btn">開始</button>
  </div>
</main>

<script src="lib/tf.min.js"></script>
<script src="lib/teachablemachine-image.min.js"></script>
<script>
// 類別順序必須和 Teachable Machine 訓練時一致(labels.txt: 0 包, 1 剪, 2 揼)
const MOVES = [
  { name: '包', emoji: '✋' },
  { name: '剪', emoji: '✌️' },
  { name: '揼', emoji: '✊' },
];
const MODEL_URL = 'model/model.json';
const META_URL  = 'model/metadata.json';
const CONF_MIN  = 0.6; // 低於此信心度視為「看不清」

const $ = id => document.getElementById(id);
let model, webcam, ready = false, busy = false, latest = [0,0,0];
const score = { win:0, draw:0, lose:0 };
const history = [0,0,0]; // 學生出過各手勢的次數

// 建立信心度條
MOVES.forEach((m,i) => {
  const d = document.createElement('div');
  d.innerHTML = `<span class="name">${m.emoji}${m.name}</span><span class="track"><span class="fill" id="f${i}" style="display:block"></span></span><span class="pct" id="p${i}">0%</span>`;
  $('bars').appendChild(d);
});

async function init() {
  $('btn').disabled = true;
  $('status').textContent = '載入 AI 模型中…';
  try {
    model = await tmImage.load(MODEL_URL, META_URL);
    webcam = new tmImage.Webcam(400, 400, false); // 不在庫內翻轉,由 CSS 鏡像顯示
    await webcam.setup({ facingMode: 'user' });
    await webcam.play();
  } catch (e) {
    $('status').textContent = '啟動失敗:' + e.message + '(請允許鏡頭權限,並確認是 https 網址)';
    $('btn').disabled = false;
    return;
  }
  ready = true;
  $('btn').disabled = false;
  $('btn').textContent = '出拳!';
  $('status').textContent = '準備好了,按「出拳!」';
  drawLoop();
  startIdlePredict();
}

async function predict() {
  const p = await model.predict(webcam.canvas);
  // 依 className 對應,避免順序假設出錯
  const out = [0,0,0];
  p.forEach(x => {
    const i = MOVES.findIndex(m => x.className.includes(m.name));
    out[i >= 0 ? i : p.indexOf(x)] = x.probability;
  });
  return out;
}

function draw(probs) {
  probs.forEach((v,i) => {
    $('f'+i).style.width = (v*100).toFixed(0) + '%';
    $('p'+i).textContent = (v*100).toFixed(0) + '%';
  });
}

// 畫面更新(畫鏡頭)和 AI 辨識拆開:辨識比較耗運算,尤其手機沒有 WebGL 時
// 會退回用 CPU 運算而變慢,如果每一幀都辨識會塞爆主執行緒,導致倒數動畫
// 和按鈕都卡住沒反應。所以畫面用 requestAnimationFrame 保持流暢,
// 辨識則用較低頻率的計時器,並且在倒數/出拳期間暫停,把運算力留給動畫。
function drawLoop() {
  webcam.update();
  $('cam').getContext('2d').drawImage(webcam.canvas, 0, 0);
  requestAnimationFrame(drawLoop);
}

let idleTimer = null, predicting = false;
function startIdlePredict() {
  stopIdlePredict();
  idleTimer = setInterval(async () => {
    if (predicting) return;
    predicting = true;
    try { const p = await predict(); latest = p; draw(p); }
    finally { predicting = false; }
  }, 200);
}
function stopIdlePredict() {
  if (idleTimer) { clearInterval(idleTimer); idleTimer = null; }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function aiPick(mode, playerMove) {
  if (mode === 'cheat') return (playerMove + 1) % 3;           // 剛好贏
  if (mode === 'learn') {
    const likely = history.indexOf(Math.max(...history));      // 學生最常出的
    if (history.every(v => v === 0)) return Math.floor(Math.random()*3);
    return (likely + 1) % 3;                                    // 出剋它的
  }
  return Math.floor(Math.random()*3);
}
// 0包 1剪 2揼:剪贏包、揼贏剪、包贏揼 → a 贏 b 當 (a - b + 3) % 3 === 2 ... 用查表最清楚
const BEATS = { 1:0, 2:1, 0:2 }; // key 贏 value
function judge(you, ai) {
  if (you === ai) return 'draw';
  return BEATS[you] === ai ? 'win' : 'lose';
}

async function play() {
  if (!ready || busy) return;
  busy = true; $('btn').disabled = true;
  // 倒數期間暫停背景辨識,把運算力留給動畫,避免手機卡住
  stopIdlePredict();
  $('panel').hidden = true; $('result').className = 'result';

  try {
    for (const t of ['3','2','1','出!']) {
      $('overlay').textContent = t;
      await sleep(t === '出!' ? 300 : 700);
    }
    $('overlay').textContent = '';

    // 「出!」後主動辨識幾次(而非等背景計時器),取信心度最高的一次
    let best = [0,0,0], bestMax = 0;
    for (let i = 0; i < 6; i++) {
      const p = await predict();
      latest = p; draw(p);
      const m = Math.max(...p);
      if (m > bestMax) { best = p; bestMax = m; }
      await sleep(40);
    }
    const you = best.indexOf(bestMax);
    $('panel').hidden = false;

    if (bestMax < CONF_MIN) {
      $('youEmoji').textContent = '❓'; $('aiEmoji').textContent = '🤖';
      $('result').textContent = 'AI 看不清你的手勢';
      $('detail').textContent = '再試一次:手放中央、光線充足';
      $('result').className = 'result draw';
    } else {
      const ai = aiPick($('mode').value, you);
      history[you]++;
      const r = judge(you, ai);
      score[r]++;
      $('youEmoji').textContent = MOVES[you].emoji;
      $('aiEmoji').textContent = MOVES[ai].emoji;
      $('result').textContent = { win:'你贏了 🎉', lose:'AI 贏了 🤖', draw:'平手' }[r];
      $('detail').textContent = `AI 認為你出「${MOVES[you].name}」,信心度 ${(bestMax*100).toFixed(0)}%`;
      $('result').className = 'result ' + r;
      $('sWin').textContent = score.win; $('sDraw').textContent = score.draw; $('sLose').textContent = score.lose;
    }
  } catch (e) {
    $('overlay').textContent = '';
    $('panel').hidden = false;
    $('result').textContent = '出錯了,再試一次';
    $('detail').textContent = e.message;
    $('result').className = 'result draw';
  } finally {
    startIdlePredict();
    busy = false; $('btn').disabled = false;
  }
}

$('btn').addEventListener('click', () => ready ? play() : init());
</script>
</body>
</html>
